name: Settle Loto Foot results

on:
  push:
    branches:
      - master
    paths:
      - scripts/settle-loto-foot.mjs
      - .github/workflows/settle-loto-foot-results.yml
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: settle-loto-foot-master
  cancel-in-progress: false

jobs:
  settle:
    name: Settle eligible grids
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Capture, settle and synchronize
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin master
            git checkout --detach origin/master

            output="$(node scripts/settle-loto-foot.mjs)"
            printf '%s\n' "$output"

            npm run loto-foot:inventory

            changed_files="$(git status --porcelain=v1 --untracked-files=all | cut -c4-)"
            blocked_count="$(printf '%s\n' "$output" | sed -n 's/^BLOCKED_COUNT=//p' | tail -n 1)"
            blocked_count="${blocked_count:-0}"

            if [ -n "$changed_files" ]; then
              unexpected_files="$(
                printf '%s\n' "$changed_files" |
                  grep -Ev '^src/content/loto-foot/(inventory\.json|results/[^/]+\.json|score-cache/[^/]+\.json)$' || true
              )"

              if [ -n "$unexpected_files" ]; then
                echo "Refusing to commit unexpected files:" >&2
                printf '%s\n' "$unexpected_files" >&2
                exit 1
              fi

              git add --all -- src/content/loto-foot
              git commit -m "content: capture and settle Loto Foot results"

              if ! git push origin HEAD:master; then
                echo "Concurrent master update while publishing settlements (${attempt}/3)." >&2
                continue
              fi
            fi

            if [ "$blocked_count" -gt 0 ]; then
              echo "Official settlements are available but some scores are still missing." >&2
              printf '%s\n' "$output" | sed -n 's/^BLOCKED_REASON=//p' >&2
              exit 1
            fi

            if [ -z "$changed_files" ]; then
              echo "No score cache, settlement or inventory update was needed."
            fi
            exit 0
          done

          echo "Unable to publish settlements after 3 attempts." >&2
          exit 1
