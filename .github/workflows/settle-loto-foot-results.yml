name: Settle Loto Foot results

on:
  push:
    branches:
      - master
    paths:
      - scripts/settle-loto-foot.mjs
      - .github/workflows/settle-loto-foot-results.yml
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: settle-loto-foot-master
  cancel-in-progress: false

jobs:
  settle:
    name: Settle eligible grids
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Settle and synchronize
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for cycle in $(seq 1 10); do
            git fetch origin master
            git checkout --detach origin/master

            output="$(node scripts/settle-loto-foot.mjs)"
            printf '%s\n' "$output"

            result_path="$(printf '%s\n' "$output" | sed -n 's/^RESULT_PATH=//p' | tail -n 1)"
            publication_id="$(printf '%s\n' "$output" | sed -n 's/^RESULT_ID=//p' | tail -n 1)"

            if [ -z "$result_path" ]; then
              echo "No additional settlement file was generated."
              exit 0
            fi

            if [ "$(git status --short | awk '{print $2}')" != "$result_path" ]; then
              echo "Refusing to commit unexpected files." >&2
              git status --short
              exit 1
            fi

            git add -- "$result_path"
            git commit -m "content: settle ${publication_id}"
            git push origin HEAD:master

            inventory_synchronized=false
            for attempt in 1 2 3; do
              git fetch origin master
              git checkout --detach origin/master
              npm run loto-foot:inventory

              if git diff --quiet -- src/content/loto-foot/inventory.json; then
                inventory_synchronized=true
                break
              fi

              git add -- src/content/loto-foot/inventory.json
              git commit -m "chore: sync Loto Foot inventory"

              if git push origin HEAD:master; then
                inventory_synchronized=true
                break
              fi

              echo "Concurrent master update while synchronizing inventory (${attempt}/3)." >&2
            done

            if [ "$inventory_synchronized" != true ]; then
              echo "Unable to synchronize the inventory." >&2
              exit 1
            fi
          done

          echo "Safety limit reached after 10 settlements." >&2
          exit 1
