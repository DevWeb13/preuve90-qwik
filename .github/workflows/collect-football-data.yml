name: Collect football data

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Données à collecter
        required: true
        default: odds
        type: choice
        options:
          - odds
          - results
          - all

permissions:
  contents: write

concurrency:
  group: collect-football-data
  cancel-in-progress: false

jobs:
  collect:
    name: Collect and publish sanitized snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test data pipeline
        run: npm run test:run -- src/lib/odds-pipeline.test.ts

      - name: Collect requested data
        env:
          COLLECTION_MODE: ${{ inputs.mode }}
          SNAPSHOT_OUTPUT: ${{ runner.temp }}/preuve90-snapshots
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: node scripts/odds/run-pipeline.mjs --mode "$COLLECTION_MODE" --output "$SNAPSHOT_OUTPUT"

      - name: Validate snapshots
        env:
          SNAPSHOT_OUTPUT: ${{ runner.temp }}/preuve90-snapshots
        run: node scripts/odds/validate-snapshots.mjs --output "$SNAPSHOT_OUTPUT"

      - name: Publish automation-data branch
        env:
          COLLECTION_MODE: ${{ inputs.mode }}
          SNAPSHOT_OUTPUT: ${{ runner.temp }}/preuve90-snapshots
        run: |
          git fetch origin automation-data || true
          if git show-ref --verify --quiet refs/remotes/origin/automation-data; then
            git switch -C automation-data origin/automation-data
          else
            git switch -c automation-data master
          fi

          mkdir -p snapshots
          case "$COLLECTION_MODE" in
            odds)
              cp "$SNAPSHOT_OUTPUT/odds.json" snapshots/odds.json
              ;;
            results)
              cp "$SNAPSHOT_OUTPUT/results.json" snapshots/results.json
              ;;
            all)
              cp "$SNAPSHOT_OUTPUT/odds.json" snapshots/odds.json
              cp "$SNAPSHOT_OUTPUT/results.json" snapshots/results.json
              ;;
          esac
          if [ ! -f snapshots/odds.json ]; then
            cp "$SNAPSHOT_OUTPUT/odds.json" snapshots/odds.json
          fi
          if [ ! -f snapshots/results.json ]; then
            cp "$SNAPSHOT_OUTPUT/results.json" snapshots/results.json
          fi
          cp "$SNAPSHOT_OUTPUT/metadata.json" snapshots/metadata.json

          git config user.name "preuve90-data-bot"
          git config user.email "preuve90-data-bot@users.noreply.github.com"
          git add -- snapshots/odds.json snapshots/results.json snapshots/metadata.json README.md
          if git diff --cached --quiet; then
            echo "Aucune modification de snapshot à publier."
            exit 0
          fi
          git commit -m "chore(data): update football snapshots"
          git push origin automation-data
