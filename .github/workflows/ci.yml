name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Synchronize lockfile metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile synchronization once
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/codex-workflow'
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile metadata is already synchronized."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm lockfile metadata"
          git push origin HEAD:chore/codex-workflow

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run fmt.check

      - name: Lint source
        run: npm run lint

      - name: Check TypeScript
        run: npm run build.types

      - name: Build application
        run: npm run build
