name: Update Loto Foot strategy stats

on:
  push:
    branches:
      - master
    paths:
      - scripts/generate-loto-foot-strategy-stats.mjs
      - .github/workflows/update-loto-foot-strategy-stats.yml
      - src/content/loto-foot/publications/*.json
      - src/content/loto-foot/results/*.json
  workflow_run:
    workflows:
      - Settle Loto Foot results
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loto-foot-strategy-stats-master
  cancel-in-progress: false

jobs:
  update:
    name: Refresh strategy memory
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Generate and publish strategy memory
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin master
            git checkout --detach origin/master

            node scripts/generate-loto-foot-strategy-stats.mjs

            changed_files="$(git status --porcelain=v1 --untracked-files=all | cut -c4-)"
            if [ -z "$changed_files" ]; then
              echo "Strategy memory already up to date."
              exit 0
            fi

            unexpected_files="$(
              printf '%s\n' "$changed_files" |
                grep -Ev '^docs/automations/loto-foot-strategy-stats\.json$' || true
            )"
            if [ -n "$unexpected_files" ]; then
              echo "Refusing to commit unexpected files:" >&2
              printf '%s\n' "$unexpected_files" >&2
              exit 1
            fi

            git add -- docs/automations/loto-foot-strategy-stats.json
            git commit -m "chore: refresh Loto Foot strategy stats"

            if git push origin HEAD:master; then
              exit 0
            fi

            echo "Concurrent master update while refreshing strategy memory (${attempt}/3)." >&2
          done

          echo "Unable to publish strategy memory after 3 attempts." >&2
          exit 1
